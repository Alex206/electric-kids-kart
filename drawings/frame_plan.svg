<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<style>text{font-family:Arial,sans-serif;font-size:18px}.small{font-size:14px}.dim{stroke:#555;stroke-width:2;fill:none}.frame{stroke:#111;stroke-width:18;fill:none}.wheel{fill:#333}.part{fill:none;stroke:#277;stroke-width:3}.label{font-weight:bold}</style>
<text x="40" y="35" class="label">Electric Kids Kart — preliminary top-view frame plan (mm)</text>
<g transform="translate(120,90)">
  <rect x="0" y="95" width="900" height="456" class="frame"/>
  <line x1="100" y1="95" x2="100" y2="551" class="frame"/><line x1="350" y1="95" x2="350" y2="551" class="frame"/><line x1="620" y1="95" x2="620" y2="551" class="frame"/><line x1="800" y1="95" x2="800" y2="551" class="frame"/>
  <rect x="260" y="190" width="310" height="260" class="part"/><text x="355" y="325">adjustable seat</text>
  <rect x="620" y="205" width="180" height="230" class="part"/><text x="655" y="325">battery</text>
  <rect x="720" y="455" width="160" height="80" class="part"/><text x="755" y="505">motor</text>
  <rect x="50" y="205" width="220" height="230" class="part"/><text x="90" y="325">pedal box</text>
  <rect x="65" y="20" width="70" height="150" rx="25" class="wheel"/><rect x="65" y="476" width="70" height="150" rx="25" class="wheel"/>
  <rect x="755" y="10" width="85" height="170" rx="25" class="wheel"/><rect x="755" y="466" width="85" height="170" rx="25" class="wheel"/>
  <line x1="100" y1="650" x2="800" y2="650" class="dim"/><line x1="100" y1="635" x2="100" y2="665" class="dim"/><line x1="800" y1="635" x2="800" y2="665" class="dim"/><text x="395" y="690">wheelbase 1100</text>
  <line x1="-55" y1="95" x2="-55" y2="551" class="dim"/><line x1="-70" y1="95" x2="-40" y2="95" class="dim"/><line x1="-70" y1="551" x2="-40" y2="551" class="dim"/><text x="-105" y="330" transform="rotate(-90 -105 330)">frame width 760</text>
</g>
<text x="40" y="735" class="small">Concept only. Update wheel/hub dimensions and driver fit before fabrication.</text>
</svg>
